name: Bug
description: Report a reproducible correctness, allocation, or compatibility defect
title: "[Bug] "
labels: ["kind:bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
      description: Include the smallest reproducer and complete output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include tl version, target backend, SDK/compiler, runtime, OS, architecture, and AOT or engine mode.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Affected invariant and completion receipt
      description: Identify failure-before-effects, deterministic generation, ABI, lifecycle, allocation, memory, or semantic parity and the regression test needed.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Agent claim
      description: Add machine, agent, branch, and worktree when work begins.
