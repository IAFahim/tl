name: publish-nuget

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.401
      - run: python3 -m unittest discover -s tests -p test_release_artifacts.py
      - run: python3 benchmarks/source_budget.py
      - run: python3 -m unittest discover -s benchmarks -p test_collect.py
      - run: dotnet build tl.slnx -c Release -m:1
      - run: dotnet test tl.slnx -c Release --no-build
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build -- --capacity
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build -- --module-capacity
      - run: dotnet run --project samples/Mixed -c Release --no-build
      - run: dotnet run --project benchmarks/Alpha -c Release --no-build -- --verify
      - run: dotnet publish tests/Tl.Alpha/Tl.Alpha.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -o artifacts/aot
      - run: ./artifacts/aot/Tl.Alpha
      - run: ./artifacts/aot/Tl.Alpha --capacity
      - run: ./artifacts/aot/Tl.Alpha --module-capacity
      - name: Build and verify exact tagged artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: eng/release-artifacts --tag "$RELEASE_TAG" artifacts/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-${{ inputs.tag }}-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: validate
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: nuget-${{ inputs.tag }}-${{ github.run_id }}
          path: artifacts/release
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.401
      - name: Verify immutable package set
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd artifacts/release
          sha256sum --check SHA256SUMS
          expected_packages=(
            "Tl.CSharp.$version.nupkg"
            "Tl.Compiler.$version.nupkg"
            "Tl.Gen.C.$version.nupkg"
            "Tl.Gen.CSharp.$version.nupkg"
            "Tl.Runtime.$version.nupkg"
          )
          expected_symbols=(
            "Tl.Compiler.$version.snupkg"
            "Tl.Gen.C.$version.snupkg"
            "Tl.Runtime.$version.snupkg"
          )
          mapfile -t actual_packages < <(find . -maxdepth 1 -type f -name '*.nupkg' -printf '%f\n' | LC_ALL=C sort)
          mapfile -t actual_symbols < <(find . -maxdepth 1 -type f -name '*.snupkg' -printf '%f\n' | LC_ALL=C sort)
          [[ "${actual_packages[*]}" == "${expected_packages[*]}" ]]
          [[ "${actual_symbols[*]}" == "${expected_symbols[*]}" ]]
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: iafahim
      - name: Publish exact packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          source=https://api.nuget.org/v3/index.json
          dotnet nuget push "artifacts/release/Tl.Runtime.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source"
          dotnet nuget push "artifacts/release/Tl.Gen.CSharp.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source"
          dotnet nuget push "artifacts/release/Tl.CSharp.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source"
          dotnet nuget push "artifacts/release/Tl.Compiler.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source"
          dotnet nuget push "artifacts/release/Tl.Gen.C.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source"
