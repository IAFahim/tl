name: publish-nuget

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - run: python3 -m unittest discover -s tests -p test_release_artifacts.py
      - run: python3 -m unittest discover -s tests -p test_readme_numbers.py
      - run: python3 benchmarks/source_budget.py
      - run: python3 -m unittest discover -s benchmarks -p test_collect.py
      - run: dotnet workload install wasm-tools
      - run: dotnet build tl.slnx -c Release -m:1
      - run: dotnet test tl.slnx -c Release --no-build
      - name: Bake and verify the Runner sample
        working-directory: samples/Runner
        run: |
          set -euo pipefail
          dotnet run --project ../../tools/Tl.Bake -c Release --no-build -- library timelines --assembly bin/Release/net10.0/Runner.dll --out game.tlib --ids Timelines.g.cs --namespace Runner
          dotnet build -c Release
          dotnet run -c Release --no-build -- --verify
      - name: Build and verify exact tagged artifacts
        run: eng/release-artifacts --tag "$RELEASE_TAG" artifacts/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: artifacts/release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Verify immutable package set
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd artifacts/release
          sha256sum --check SHA256SUMS
          expected_packages=(
            "Tl.Bake.$version.nupkg"
            "Tl.CSharp.$version.nupkg"
            "Tl.Gen.CSharp.$version.nupkg"
            "Tl.Runtime.$version.nupkg"
          )
          expected_symbols=(
            "Tl.Runtime.$version.snupkg"
          )
          mapfile -t actual_packages < <(find . -maxdepth 1 -type f -name '*.nupkg' -printf '%f\n' | LC_ALL=C sort)
          mapfile -t actual_symbols < <(find . -maxdepth 1 -type f -name '*.snupkg' -printf '%f\n' | LC_ALL=C sort)
          [[ "${actual_packages[*]}" == "${expected_packages[*]}" ]]
          [[ "${actual_symbols[*]}" == "${expected_symbols[*]}" ]]
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: iafahim
      - name: Publish exact packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          source=https://api.nuget.org/v3/index.json
          dotnet nuget push "artifacts/release/Tl.Runtime.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate
          dotnet nuget push "artifacts/release/Tl.Gen.CSharp.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate
          dotnet nuget push "artifacts/release/Tl.Bake.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate
          dotnet nuget push "artifacts/release/Tl.CSharp.$version.nupkg" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate
