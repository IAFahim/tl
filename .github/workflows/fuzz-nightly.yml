name: fuzz-nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Install AFL++
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq afl++
      - name: Property laws plus deterministic mutation fuzz
        run: dotnet test tests/Tl.Fuzz/Tl.Fuzz.csproj -c Release -p:NuGetAudit=false
      - name: Coverage-guided campaign (25 minutes per boundary)
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet tool install --global SharpFuzz.CommandLine --version 2.3.0
          eng/fuzz-smoke 1500
      - name: Upload fuzz findings on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-findings
          path: artifacts/fuzz/out-*/
          if-no-files-found: ignore
          overwrite: true
