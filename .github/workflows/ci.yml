name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x
      - run: python3 benchmarks/source_budget.py
      - run: python3 -m unittest discover -s benchmarks -p test_collect.py
      - run: python3 -m unittest discover -s tests -p test_release_artifacts.py
      - run: dotnet build tl.slnx -c Release -m:1
      - run: dotnet test tl.slnx -c Release --no-build
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build -- --capacity
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build -- --module-capacity
      - run: dotnet run --project samples/Mixed -c Release --no-build
      - run: dotnet run --project benchmarks/Alpha -c Release --no-build -- --verify
      - run: dotnet publish tests/Tl.Alpha/Tl.Alpha.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -o artifacts/aot
      - run: ./artifacts/aot/Tl.Alpha
      - run: ./artifacts/aot/Tl.Alpha --capacity
      - run: ./artifacts/aot/Tl.Alpha --module-capacity
      - run: eng/release-artifacts --candidate ci artifacts/release
