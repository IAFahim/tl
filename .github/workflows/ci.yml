name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Setup dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Check source budget and benchmark collection
        run: |
          python3 benchmarks/source_budget.py
          python3 -m unittest discover -s benchmarks -p test_collect.py
      - name: Build solution (Release)
        run: dotnet build tl.slnx -c Release -m:1
      - name: Run tests
        run: dotnet test tl.slnx -c Release --no-build
      - name: Publish NativeAOT executable
        run: dotnet publish tests/Tl.Aot/Tl.Aot.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true
      - name: Execute NativeAOT binary
        run: ./tests/Tl.Aot/bin/Release/net10.0/linux-x64/publish/Tl.Aot
      - name: Baseline verification - Dispatch
        run: dotnet run --project benchmarks/Dispatch --no-build -c Release -- --verify
      - name: Baseline verification - Dispatch edges
        run: dotnet run --project benchmarks/Dispatch --no-build -c Release -- --verify-edges
      - name: Baseline verification - Algorithms
        run: dotnet run --project benchmarks/Algorithms --no-build -c Release -- --verify
      - name: Baseline verification - Review
        run: dotnet run --project benchmarks/Review --no-build -c Release -- --verify
      - name: Baseline verification - AotBench
        run: dotnet run --project benchmarks/AotBench --no-build -c Release -- --check
      - name: Verify compiled timeline parity
        run: dotnet run --project samples/Compiled -c Release --no-build
      - name: Verify compiled timeline under NativeAOT
        run: |
          set -euo pipefail
          dotnet publish samples/Compiled/Compiled.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true
          ./samples/Compiled/bin/Release/net10.0/linux-x64/publish/Compiled
      - name: Pack packages
        run: |
          set -euo pipefail
          dotnet pack src/Tl.Core -c Release -o artifacts/packages
          dotnet pack src/Tl.Gen -c Release -o artifacts/packages
      - name: Verify clean package consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/tl-package-consumer
        run: |
          set -euo pipefail
          dotnet restore tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj --source artifacts/packages
          dotnet build tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -c Release --no-restore
          test "$(./tests/Tl.PackageConsumer/bin/Release/net10.0/Tl.PackageConsumer)" = "7"
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Tl.Gen.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Waffle.Core.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Microsoft.CodeAnalysis.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Microsoft.CodeAnalysis.CSharp.dll
          dotnet build tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -c Release --no-restore | tee artifacts/package-cache.log
          grep -F "TlGenCompile: cache hit" artifacts/package-cache.log
