name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash -n eng/agent-work
      - run: python3 eng/test_agent_work.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - run: eng/test-isolated-output
      - run: python3 benchmarks/source_budget.py
      - run: python3 -m unittest discover -s benchmarks -p test_collect.py
      - run: python3 -m unittest discover -s tests -p test_release_artifacts.py
      - run: dotnet build tl.slnx -c Release -m:1 -p:NuGetAudit=false
      - run: dotnet test tl.slnx -c Release --no-build -p:NuGetAudit=false
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build -- --capacity
      - run: dotnet run --project tests/Tl.Alpha -c Release --no-build -- --module-capacity
      - run: dotnet run --project samples/Mixed -c Release --no-build
      - name: Run the SingleTimeline sample (direct/kernel/interpreter receipts)
        working-directory: samples/SingleTimeline
        run: |
          dotnet build -c Release
          dotnet run -c Release --no-build -- one
          dotnet run -c Release --no-build -- three
      - name: Run the ManyEntities sample (facade vs playback-table parity)
        working-directory: samples/ManyEntities
        run: |
          dotnet build -c Release
          dotnet run -c Release --no-build
      - run: dotnet run --project benchmarks/Alpha -c Release --no-build -- --verify
      - run: dotnet publish tests/Tl.Alpha/Tl.Alpha.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -o artifacts/aot
      - run: ./artifacts/aot/Tl.Alpha
      - run: ./artifacts/aot/Tl.Alpha --capacity
      - run: ./artifacts/aot/Tl.Alpha --module-capacity
      - name: Verify NativeAOT runtime isolation
        run: |
          test -z "$(find artifacts/aot -type f \( -name 'Tl.Gen*' -o -name 'Microsoft.CodeAnalysis*' -o -name 'Waffle*' \) -print -quit)"
      - run: dotnet pack src/Tl.Core -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Tl.Gen.CSharp -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Tl.CSharp -c Release --no-build -m:1 -o artifacts/packages
      - name: Verify package consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/tl-package-consumer
        run: |
          set -euo pipefail
          dotnet restore tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj --source artifacts/packages
          dotnet build tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -c Release --no-restore
          test "$(./tests/Tl.PackageConsumer/bin/Release/net10.0/Tl.PackageConsumer)" = "7"
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Tl.Gen.CSharp.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Tl.Gen.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Microsoft.CodeAnalysis.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Microsoft.CodeAnalysis.CSharp.dll
          test ! -e tests/Tl.PackageConsumer/bin/Release/net10.0/Tl.Gen.C.dll
          dotnet msbuild tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -t:TlGenExport -p:Configuration=Release -p:TlGenAssembly="${{ github.workspace }}/src/Tl.Gen.CSharp/bin/Release/net10.0/Tl.Gen.CSharp.dll" | tee artifacts/package-export.log
          grep -F "TlGenCompile: cache miss" artifacts/package-export.log
          dotnet msbuild tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -t:TlGenExport -p:Configuration=Release -p:TlGenAssembly="${{ github.workspace }}/src/Tl.Gen.CSharp/bin/Release/net10.0/Tl.Gen.CSharp.dll" | tee artifacts/package-cache.log
          grep -F "TlGenCompile: cache hit" artifacts/package-cache.log
          dotnet restore tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -r linux-x64 -p:PublishAot=true --source artifacts/packages --source https://api.nuget.org/v3/index.json
          dotnet publish tests/Tl.PackageConsumer/Tl.PackageConsumer.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true --no-restore -o artifacts/package-aot
          test "$(./artifacts/package-aot/Tl.PackageConsumer)" = "7"
          test -z "$(find artifacts/package-aot -type f \( -name 'Tl.Gen*' -o -name 'Microsoft.CodeAnalysis*' -o -name 'Waffle*' \) -print -quit)"
      - name: NuGet quick-start sample consumes the published packages
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/tl-nuget-sample
        run: |
          set -euo pipefail
          dotnet build samples/NuGetQuickStart/NuGetQuickStart.csproj -c Release
          dotnet tool install --global Tl.Bake --version 1.0.0-alpha.6
          tlbake samples/NuGetQuickStart/boss.json samples/NuGetQuickStart/boss.tlb --assembly samples/NuGetQuickStart/bin/Release/net10.0/NuGetQuickStart.dll
          cd samples/NuGetQuickStart
          test "$(dotnet run -c Release --no-build)" = "flawless: health=80 position=2"
      - name: Playback prototype parity lanes
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/tl-playback-prototype
        run: |
          set -euo pipefail
          dotnet build benchmarks/PlaybackPrototype/PlaybackPrototype.csproj -c Release
          dotnet run --project benchmarks/PlaybackPrototype -c Release --no-build
      - run: eng/release-artifacts --candidate ci artifacts/release
