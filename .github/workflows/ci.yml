name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Setup dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Check source budget and benchmark collection
        run: |
          python3 benchmarks/source_budget.py
          python3 -m unittest discover -s benchmarks -p test_collect.py
      - name: Build solution (Release)
        run: dotnet build tl.slnx -c Release
      - name: Run tests
        run: dotnet test tl.slnx -c Release --no-build
      - name: Publish NativeAOT executable
        run: dotnet publish tests/Tl.Aot/Tl.Aot.csproj -c Release -r linux-x64
      - name: Execute NativeAOT binary
        run: ./tests/Tl.Aot/bin/Release/net10.0/linux-x64/publish/Tl.Aot
      - name: Baseline verification - Dispatch
        run: dotnet run --project benchmarks/Dispatch --no-build -c Release -- --verify
      - name: Baseline verification - Dispatch edges
        run: dotnet run --project benchmarks/Dispatch --no-build -c Release -- --verify-edges
      - name: Baseline verification - Algorithms
        run: dotnet run --project benchmarks/Algorithms --no-build -c Release -- --verify
      - name: Baseline verification - Review
        run: dotnet run --project benchmarks/Review --no-build -c Release -- --verify
      - name: Baseline verification - AotBench
        run: dotnet run --project benchmarks/AotBench --no-build -c Release -- --check
      - name: Verify experimental fusion generation
        run: |
          dotnet run --project benchmarks/FusionGenerate -c Release -- --self-test
          dotnet run --project benchmarks/FusionGenerate -c Release -- --output "$RUNNER_TEMP/FusedPulse.g.cs"
          cmp benchmarks/FusionHour/Generated/FusedPulse.g.cs "$RUNNER_TEMP/FusedPulse.g.cs"
          dotnet run --project benchmarks/FusionChecks -c Release
      - name: Verify experimental fusion under NativeAOT
        run: |
          dotnet publish benchmarks/FusionChecks -c Release -r linux-x64 -p:PublishAot=true
          ./benchmarks/FusionChecks/bin/Release/net10.0/linux-x64/publish/FusionChecks
      - name: Pack packages
        run: |
          dotnet pack src/Tl.Core -c Release -o artifacts/packages
          dotnet pack src/Tl.Gen -c Release -o artifacts/packages
