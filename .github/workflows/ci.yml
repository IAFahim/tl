name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Dispatch, Algorithms, Review]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Setup dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build benchmarks/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -v q -clp:ErrorsOnly
      - name: Verify receipts
        run: dotnet run --project benchmarks/${{ matrix.project }} --no-build -c Release -- --verify
