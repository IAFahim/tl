name: benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - run: dotnet build benchmarks/Alpha/Alpha.csproj -c Release
      - run: dotnet run --project benchmarks/Alpha -c Release --no-build -- --verify
      - run: dotnet run --project benchmarks/Alpha -c Release --no-build -- --filter '*' --artifacts bench-ci/alpha
      - run: python3 benchmarks/collect.py bench-ci/alpha/results/*-report-full.json --output benchmark-results.json --excluded benchmark-excluded.json
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_number }}
          path: |
            benchmark-results.json
            benchmark-excluded.json
            bench-ci/
      - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: tl v1 benchmarks
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
