name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - run: python3 -m unittest discover -s tests -p test_release_artifacts.py
      - name: Build exact tagged artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: eng/release-artifacts --tag "$RELEASE_TAG" artifacts/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tl-${{ inputs.tag }}-release-assets
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
